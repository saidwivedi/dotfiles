# cmux workspace integration — WORKSTATION side.
#
# Append this to ~/.tmux.conf on the WORKSTATION (the box you reach with `connect`),
# NOT on the Mac.
#
# 1) Workspace title — makes the cmux sidebar name reflect what is running inside each
#    tmux session. Claude (or any program) sets the pane title -> tmux emits it as the
#    terminal title (OSC 2) -> mosh/ssh forwards it -> cmux shows it. Shows the running
#    command's title (#T), or the cwd basename at a shell. "[M]" marks "workstation".
set -g set-titles on
set -g set-titles-string "[M] #{?#{m:*sh,#{pane_current_command}},#{b:pane_current_path},#T}"

# 2) Truecolor (24-bit) — `connect` sets COLORTERM=truecolor; these forward RGB through
#    tmux out to cmux and propagate COLORTERM into new panes (so vim and other programs
#    emit 24-bit color). Without the Tc override, tmux clamps everything to 256 colors.
set -ga terminal-overrides ",*:Tc"
set -ga update-environment " COLORTERM"

